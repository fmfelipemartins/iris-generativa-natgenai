<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-label="Pipeline Iris Generativa"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1000" height="660" fill="#f8fafc"/><path d="M500 90 V115 H255 V140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 115 H745 V140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M255 225 V255 H500 V280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 225 V255 H500" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 345 V400" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 465 V495 H255 V525" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 495 H745 V525" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 312 H985 V115 H745 V140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="860" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">repetir gerações</text><path d="M745 115 H255 V140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="300" y="25" width="400" height="65" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="500.0" y="52" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">1. Preparar dados e contexto</text><text x="500.0" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Escalas, fitness e cinco nichos por tarefa</text><rect x="40" y="140" width="430" height="85" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="255.0" y="167" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">2A. Recombinação</text><text x="255.0" y="191" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Torneio → SBX simétrico / OB-Scan / híbrido</text><rect x="530" y="140" width="430" height="85" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="745.0" y="167" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">2B. Modelos gerativos</text><text x="745.0" y="191" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Selecionar pais → Gaussianas / VAE-EDA</text><rect x="300" y="280" width="400" height="65" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="500.0" y="307" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">3. Moderar sobrevivência</text><text x="500.0" y="331" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Cotas por tarefa; nichos opcionais</text><rect x="300" y="400" width="400" height="65" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="500.0" y="427" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">4. Avaliar sintéticos</text><text x="500.0" y="451" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Fidelidade, diversidade e discriminadores</text><rect x="40" y="525" width="430" height="85" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="255.0" y="552" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">5. Testar estabilidade e mecanismos</text><text x="255.0" y="576" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Seeds, sensibilidade e laboratório 2D</text><rect x="530" y="525" width="430" height="85" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="745.0" y="552" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">6. Validar com dados reservados</text><text x="745.0" y="576" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Cross-fitting: reajuste dentro de cada fold</text><text x="500" y="640" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Diagnósticos por geração: pais, candidatos, sobreviventes e latentes • Exportação CSV + metadados</text></svg>