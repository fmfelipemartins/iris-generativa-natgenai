<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480" role="img" aria-labelledby="title desc">
<title id="title">Pipeline do refinamento 2.5</title>
<desc id="desc">Seleção interna de alternativas SBX e VAE, confirmação com guardas e avaliação externa independente. Controles não selecionam configurações.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1200" height="1480" fill="#f8fafc"/>
<text x="600" y="36" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#0c4a6e">REFINAMENTO 2.5 · SELEÇÃO INTERNA E TESTE EXTERNO</text>
<text x="600" y="67" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Cinco folds externos · contexto e gerador ajustados apenas no treino correspondente</text>
<rect x="60" y="100" width="650" height="90" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="385.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">1. Diagnóstico e catálogo predefinido</text>
<text x="385.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Contrastes isolados de SBX e VAE; referências da 2.4</text>
<rect x="800" y="100" width="340" height="115" rx="12" fill="#fff7ed" stroke="#0369a1"/>
<text x="970.0" y="130" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">Teste externo reservado</text>
<text x="970.0" y="158" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Não participa da triagem,</text>
<text x="970.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">confirmação ou escolha.</text>
<rect x="60" y="230" width="650" height="115" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="385.0" y="260" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">2. Triagem interna</text>
<text x="385.0" y="288" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">2 folds internos · 3 seeds · 10 gerações</text>
<text x="385.0" y="312" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Referência e alternativas → um finalista por família/fold</text>
<rect x="60" y="385" width="650" height="115" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="385.0" y="415" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">3. Confirmação interna</text>
<text x="385.0" y="443" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Referência + finalista · 5 seeds · 40 gerações</text>
<text x="385.0" y="467" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Perda: 50% candidatos + 50% sobreviventes</text>
<rect x="60" y="540" width="650" height="135" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="385.0" y="570" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">4. Aplicar guardas e congelar a decisão</text>
<text x="385.0" y="598" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Ganho mínimo de 5%; critérios por componente e espécie.</text>
<text x="385.0" y="622" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Verificar fidelidade, diversidade, proximidade, coerência</text>
<text x="385.0" y="646" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">e duplicatas. Se falhar, manter a referência.</text>
<rect x="60" y="720" width="650" height="135" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="385.0" y="750" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">5. Avaliar no teste externo</text>
<text x="385.0" y="778" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Reajustar no treino externo · 5 seeds · 40 gerações</text>
<text x="385.0" y="802" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Medir referência e finalista, inclusive o rejeitado.</text>
<text x="385.0" y="826" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Procedimento selecionado segue a decisão interna.</text>
<rect x="800" y="385" width="340" height="205" rx="12" fill="#fff7ed" stroke="#0369a1"/>
<text x="970.0" y="415" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">Controles em paralelo</text>
<text x="970.0" y="443" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Inicialização e Gaussiana direta;</text>
<text x="970.0" y="467" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">mistura sem transferência;</text>
<text x="970.0" y="491" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">mistura e produto históricos.</text>
<text x="970.0" y="515" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Ajustados no treino externo.</text>
<text x="970.0" y="539" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Sem promover configurações.</text>
<rect x="60" y="900" width="1080" height="135" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="600.0" y="930" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">6. Diagnósticos complementares</text>
<text x="600.0" y="958" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Distinguibilidade real/sintético · utilidade: prever espécie em reais reservados</text>
<text x="600.0" y="982" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Proximidade, diversidade por espécie, fundadores, custo e diagnósticos do VAE</text>
<text x="600.0" y="1006" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Checkpoints 5, 10, 20 e 40 são descritivos; não escolhem a duração.</text>
<rect x="60" y="1080" width="1080" height="115" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="600.0" y="1110" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">7. Auditar, consolidar e documentar</text>
<text x="600.0" y="1138" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Divisões, seeds, pareamento, decisões e integridade</text>
<text x="600.0" y="1162" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Relatórios, incerteza e seção 8 do notebook; leitura sem disparar a busca</text>
<path d="M385 190 V230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M385 345 V385" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M385 500 V540" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M385 675 V720" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M385 855 V900" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 1035 V1080" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M970 215 V305 H1170 V787 H710" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M970 590 V635 H1170 V967 H1140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="1240" width="1080" height="165" rx="12" fill="#12313f"/>
<text x="600" y="1275" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#ffffff">725 execuções full · parâmetros padrão preservados</text>
<text x="600" y="1310" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="normal" fill="#ffffff">Sem ganho adicional do procedimento selecionado sobre a 2.4.</text>
<text x="600" y="1343" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="normal" fill="#ffffff">Utilidade e discriminadores não selecionam hiperparâmetros.</text>
<text x="600" y="1376" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#ffffff">Gaussiana direta: controle sem evolução; perda apenas da amostra final.</text>
<text x="600" y="1445" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#334155">Resultados exploratórios na Iris; validação independente permanece necessária.</text>
</svg>
