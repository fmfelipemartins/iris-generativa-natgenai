<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-label="Pipeline de refinamento com avaliação aninhada"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1200" height="1160" fill="#f8fafc"/><path d="M600 110 V135 H350 V165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 135 H945 V165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 255 V275 H195 V300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 275 H505 V300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M195 410 V432 H350 V455" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M505 410 V432 H350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 545 V590" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 700 V745" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 840 V867 H600 V895" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M945 255 V942 H870" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 990 V1040" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M60 500 H25 V275 H350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="30" width="540" height="80" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="600.0" y="65" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">1. Separar treino e teste externo</text><text x="600.0" y="95" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Cinco folds; teste não escolhe configurações</text><rect x="60" y="165" width="580" height="90" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="350.0" y="200" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">2. Ajustar contexto no treino interno</text><text x="350.0" y="230" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Escalas, fitness, cinco nichos e inicialização</text><rect x="750" y="165" width="390" height="90" rx="12" fill="#fff7ed" stroke="#0369a1"/><text x="945.0" y="200" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">Teste externo reservado</text><text x="945.0" y="230" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Usado somente após a decisão</text><rect x="60" y="300" width="270" height="110" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="195.0" y="335" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">3A. Crossover</text><text x="195.0" y="365" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">SBX / OB-Scan / híbrido</text><rect x="370" y="300" width="270" height="110" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="505.0" y="335" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">3B. Modelos EDA</text><text x="505.0" y="365" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Pais por fitness ou nichos</text><rect x="60" y="455" width="580" height="90" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="350.0" y="490" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">4. Gerar e selecionar sobreviventes</text><text x="350.0" y="520" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Candidatos, fundadores e diversidade por espécie</text><rect x="60" y="590" width="580" height="110" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="350.0" y="625" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">5. Comparar variantes internamente</text><text x="350.0" y="655" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Triagem → confirmação → refinamentos</text><rect x="60" y="745" width="580" height="95" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="350.0" y="780" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">6. Congelar escolha por fold</text><text x="350.0" y="810" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Referência permanece se as guardas falharem</text><rect x="330" y="895" width="540" height="95" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="600.0" y="930" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">7. Avaliar fora da seleção</text><text x="600.0" y="960" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">50 por espécie na evolução; amostra para avaliar</text><rect x="330" y="1040" width="540" height="85" rx="12" fill="#e0f2fe" stroke="#0369a1"/><text x="600.0" y="1075" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0c4a6e">8. Consolidar evidências</text><text x="600.0" y="1105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">Diferenças pareadas, métricas e custo</text></svg>